# fly.toml app configuration file for TicketWatcher
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ticketwatcher'
primary_region = 'ewr'

[build]
[env]
  HTTP_ADDR = ':8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
